services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: change-me-in-production
      DATABASE_URL: sqlite:////app/instance/contest_settlement.db
      MAX_CONTENT_LENGTH: "2097152"
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped